<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1f56b8">
  <meta name="description" content="Logic Labyrinth: mueve todas las bolas a la vez y lleva una al agujero. 100 niveles de ingenio.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Logic Labyrinth</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" as="font" type="font/ttf" href="fonts/Fredoka.ttf" crossorigin>
  <link rel="preload" as="image" href="img/menu.webp">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="backdrop" aria-hidden="true"></div>
  <div class="ext" id="ext-top" aria-hidden="true"></div>
  <div class="ext" id="ext-bottom" aria-hidden="true"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff27a"/><stop offset=".55" stop-color="#ffc91f"/><stop offset="1" stop-color="#ff9d0a"/></linearGradient>
      <linearGradient id="g-grey" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9c4dd"/><stop offset="1" stop-color="#8793b4"/></linearGradient>
      <linearGradient id="g-lock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe98a"/><stop offset=".5" stop-color="#f3c23a"/><stop offset="1" stop-color="#c98a12"/></linearGradient>
    </defs>
    <symbol id="i-star" viewBox="0 0 48 48"><path d="M24 4.5l5.7 12 13 1.7-9.6 9 2.5 13L24 33.8 12.4 40.2l2.5-13-9.6-9 13-1.7z" fill="url(#g-gold)" stroke="#d97a00" stroke-width="3" stroke-linejoin="round"/><path d="M24 9.5l3.4 7.4" stroke="#fff" stroke-opacity=".7" stroke-width="2.6" stroke-linecap="round" fill="none"/></symbol>
    <symbol id="i-star-off" viewBox="0 0 48 48"><path d="M24 4.5l5.7 12 13 1.7-9.6 9 2.5 13L24 33.8 12.4 40.2l2.5-13-9.6-9 13-1.7z" fill="url(#g-grey)" stroke="#5a6691" stroke-width="3" stroke-linejoin="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 64 72"><path d="M17 32V22a15 15 0 0 1 30 0v10" fill="none" stroke="#a9700c" stroke-width="12" stroke-linecap="round"/><path d="M17 32V22a15 15 0 0 1 30 0v10" fill="none" stroke="#f6cf55" stroke-width="7" stroke-linecap="round"/><rect x="6" y="30" width="52" height="38" rx="9" fill="url(#g-lock)" stroke="#a9700c" stroke-width="3.5"/><rect x="11" y="34" width="42" height="6" rx="3" fill="#fff" fill-opacity=".45"/><circle cx="32" cy="46" r="5.5" fill="#2a1a05"/><path d="M29.5 48h5l2 12h-9z" fill="#2a1a05"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 48 48"><path d="M24 4.5c-8.3 0-14.5 6.2-14.5 14 0 5.2 2.7 8.6 5.4 11.4 1.6 1.7 2.6 3.2 2.6 5.6h13c0-2.4 1-3.9 2.6-5.6 2.7-2.8 5.4-6.2 5.4-11.4 0-7.8-6.2-14-14.5-14z" fill="url(#g-gold)" stroke="#d97a00" stroke-width="2.6" stroke-linejoin="round"/><path d="M17 12.5c1.8-2.4 4.2-3.6 7-3.6" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2.6" stroke-linecap="round"/><rect x="17" y="37" width="14" height="4" rx="2" fill="#dfe6f5" stroke="#5a6691" stroke-width="1.6"/><rect x="19" y="41.6" width="10" height="3.4" rx="1.7" fill="#b9c4dd" stroke="#5a6691" stroke-width="1.6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4v4h4" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><g fill="currentColor"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></g></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <main id="stage">
    <!-- INICIO: design/menu.webp. El logo y los tres botones son los del diseño. -->
    <section class="screen" id="home" style="background-image:url(img/menu.webp)">
      <i class="flame" style="--x:42;--y:1140"></i>
      <i class="flame" style="--x:898;--y:1162"></i>
      <i class="spark" style="--x:42;--y:1150;--dx:-26;--d:0.0s;--w:2.3s"></i>
      <i class="spark" style="--x:42;--y:1150;--dx:18;--d:0.5s;--w:2.9s"></i>
      <i class="spark" style="--x:42;--y:1150;--dx:-8;--d:1.1s;--w:2.0s"></i>
      <i class="spark" style="--x:42;--y:1150;--dx:30;--d:1.6s;--w:3.2s"></i>
      <i class="spark" style="--x:42;--y:1150;--dx:-34;--d:2.2s;--w:2.6s"></i>
      <i class="spark" style="--x:42;--y:1150;--dx:6;--d:2.7s;--w:2.2s"></i>
      <i class="spark" style="--x:898;--y:1172;--dx:-26;--d:0.0s;--w:2.3s"></i>
      <i class="spark" style="--x:898;--y:1172;--dx:18;--d:0.5s;--w:2.9s"></i>
      <i class="spark" style="--x:898;--y:1172;--dx:-8;--d:1.1s;--w:2.0s"></i>
      <i class="spark" style="--x:898;--y:1172;--dx:30;--d:1.6s;--w:3.2s"></i>
      <i class="spark" style="--x:898;--y:1172;--dx:-34;--d:2.2s;--w:2.6s"></i>
      <i class="spark" style="--x:898;--y:1172;--dx:6;--d:2.7s;--w:2.2s"></i>
      <button class="hit pill shine" data-go="levels" aria-label="Jugar" style="--x:133;--y:660;--w:676;--h:190"></button>
      <button class="hit pill" data-action="tutorial" aria-label="Cómo jugar" style="--x:133;--y:868;--w:676;--h:174"></button>
      <button class="hit pill" data-action="options" aria-label="Opciones" style="--x:133;--y:1054;--w:676;--h:172"></button>
      <p class="home-stars"><svg><use href="#i-star"/></svg><span id="home-stars">0</span> / 300</p>
    </section>

    <!-- NIVELES: design/niveles_madera.webp con título, casillas y puntos limpiados. -->
    <section class="screen" id="levels" style="background-image:url(img/levels.webp)">
      <i class="flame" style="--x:30;--y:1328"></i>
      <i class="flame" style="--x:905;--y:1332"></i>
      <i class="spark" style="--x:30;--y:1338;--dx:-22;--d:0.0s;--w:2.3s"></i>
      <i class="spark" style="--x:30;--y:1338;--dx:18;--d:0.5s;--w:2.9s"></i>
      <i class="spark" style="--x:30;--y:1338;--dx:-8;--d:1.1s;--w:2.0s"></i>
      <i class="spark" style="--x:30;--y:1338;--dx:28;--d:1.6s;--w:3.2s"></i>
      <i class="spark" style="--x:30;--y:1338;--dx:-30;--d:2.2s;--w:2.6s"></i>
      <i class="spark" style="--x:30;--y:1338;--dx:6;--d:2.7s;--w:2.2s"></i>
      <i class="spark" style="--x:905;--y:1342;--dx:-22;--d:0.0s;--w:2.3s"></i>
      <i class="spark" style="--x:905;--y:1342;--dx:18;--d:0.5s;--w:2.9s"></i>
      <i class="spark" style="--x:905;--y:1342;--dx:-8;--d:1.1s;--w:2.0s"></i>
      <i class="spark" style="--x:905;--y:1342;--dx:28;--d:1.6s;--w:3.2s"></i>
      <i class="spark" style="--x:905;--y:1342;--dx:-30;--d:2.2s;--w:2.6s"></i>
      <i class="spark" style="--x:905;--y:1342;--dx:6;--d:2.7s;--w:2.2s"></i>
      <button class="hit" data-go="home" aria-label="Menú" style="--x:52;--y:52;--w:282;--h:120;--r:40"></button>
      <div class="plaque">
        <h2 class="gold" id="levels-title" data-text="Madera">Madera</h2>
        <p class="plaque-sub" id="levels-stars">0 / 60 estrellas</p>
      </div>
      <div id="level-grid"></div>
      <div class="pager">
        <button class="pager-arrow" data-action="world-prev" aria-label="Mundo anterior"><svg><use href="#i-prev"/></svg></button>
        <div id="world-dots"></div>
        <button class="pager-arrow" data-action="world-next" aria-label="Mundo siguiente"><svg><use href="#i-next"/></svg></button>
      </div>
    </section>

    <!-- JUEGO: design/mundoN_*.webp. Marco, barra y botones son los del diseño. -->
    <section class="screen" id="game">
      <button class="hit" data-action="pause" aria-label="Pausa" style="--x:48;--y:110;--w:130;--h:132;--r:34"></button>
      <button class="hit" data-action="restart" aria-label="Reiniciar" style="--x:186;--y:110;--w:130;--h:132;--r:34"></button>
      <button class="hit" data-action="to-levels" aria-label="Volver a niveles" style="--x:762;--y:110;--w:134;--h:132;--r:34"></button>
      <div class="plate">
        <p class="plate-moves">Movimientos: <b id="hud-moves">0</b></p>
        <p class="plate-record">Récord: <span id="hud-record">0</span></p>
      </div>
      <canvas class="board" id="board" role="application" aria-label="Tablero. Usa las flechas, desliza o toca un lado para mover las bolas."></canvas>
      <button class="help-btn" id="help-btn" data-action="help" aria-label="Ayuda"><svg><use href="#i-bulb"/></svg><span>Ayuda</span></button>
      <div class="coach" id="coach" hidden>
        <p id="coach-text"></p>
        <button class="btn btn-green btn-sm" id="coach-next">Siguiente</button>
      </div>
    </section>

    <!-- MODALES -->
    <div class="modal" id="pause-modal" hidden>
      <div class="card">
        <h3 class="gold" data-text="Pausa">Pausa</h3>
        <button class="btn btn-green" data-action="resume"><svg><use href="#i-play"/></svg>Continuar</button>
        <button class="btn" data-action="restart"><svg><use href="#i-restart"/></svg>Reiniciar</button>
        <button class="btn" data-action="to-levels"><svg><use href="#i-grid"/></svg>Niveles</button>
        <div class="toggles">
          <label class="toggle"><span>Sonidos</span><input type="checkbox" data-setting="sound"><i></i></label>
          <label class="toggle"><span>Música</span><input type="checkbox" data-setting="music"><i></i></label>
        </div>
      </div>
    </div>

    <div class="modal" id="win-modal" hidden>
      <div class="confetti" aria-hidden="true"></div>
      <div class="card">
        <p class="kicker" id="win-kicker">Nivel 1</p>
        <h3 class="gold" id="win-title" data-text="¡Superado!">¡Superado!</h3>
        <div class="win-stars" id="win-stars">
          <span><svg class="off"><use href="#i-star-off"/></svg><svg class="on"><use href="#i-star"/></svg></span>
          <span><svg class="off"><use href="#i-star-off"/></svg><svg class="on"><use href="#i-star"/></svg></span>
          <span><svg class="off"><use href="#i-star-off"/></svg><svg class="on"><use href="#i-star"/></svg></span>
        </div>
        <p class="detail" id="win-detail"></p>
        <p class="detail small" id="win-help" hidden>Con pista el máximo son 2 estrellas.</p>
        <p class="best" id="win-best" hidden>¡Nuevo mejor resultado!</p>
        <button class="btn btn-green" data-action="next"><span id="next-label">Siguiente</span><svg><use href="#i-next"/></svg></button>
        <div class="row">
          <button class="btn btn-sm" data-action="restart"><svg><use href="#i-restart"/></svg>Repetir</button>
          <button class="btn btn-sm" data-action="to-levels"><svg><use href="#i-grid"/></svg>Niveles</button>
        </div>
      </div>
    </div>

    <div class="modal" id="help-modal" hidden>
      <div class="card">
        <h3 class="gold" data-text="Ayuda">Ayuda</h3>
        <p class="detail small" id="help-note"></p>
        <button class="btn btn-green btn-two" data-action="hint">
          <svg><use href="#i-bulb"/></svg>
          <span>Pista<small>El siguiente movimiento · máximo <svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg></small></span>
        </button>
        <button class="btn btn-two" data-action="solve">
          <svg><use href="#i-play"/></svg>
          <span>Resolver<small>Lo termino por ti · te llevas <svg><use href="#i-star"/></svg></small></span>
        </button>
        <button class="btn btn-sm btn-ghost" data-action="close-modal">Seguir solo</button>
      </div>
    </div>

    <div class="modal" id="options-modal" hidden>
      <div class="card">
        <h3 class="gold" data-text="Opciones">Opciones</h3>
        <div class="toggles column">
          <label class="toggle"><span>Sonidos</span><input type="checkbox" data-setting="sound"><i></i></label>
          <label class="toggle"><span>Música</span><input type="checkbox" data-setting="music"><i></i></label>
          <label class="toggle"><span>Vibración</span><input type="checkbox" data-setting="vibration"><i></i></label>
        </div>
        <button class="btn btn-sm" data-action="privacy">Política de privacidad</button>
        <p class="credits">Juego original: <b>Esteban Etayo</b> · Chocodroid, 2011</p>
        <button class="btn btn-sm btn-red" data-action="ask-reset">Resetear juego</button>
        <button class="btn btn-green" data-action="close-modal">Volver</button>
      </div>
    </div>

    <div class="modal" id="reset-modal" hidden>
      <div class="card">
        <h3 class="gold small" data-text="¿Resetear?">¿Resetear?</h3>
        <p class="detail">Se borrará todo tu progreso y tus estrellas.</p>
        <button class="btn btn-red" data-action="do-reset">Sí, borrar todo</button>
        <button class="btn" data-action="close-modal">Cancelar</button>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
